name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner: praxis-linux
          - os: macos-15
            runner: praxis-macos
          - os: windows-2025
            runner: praxis-windows
    steps:
      - name: Refuse external fork code on owner-operated runners
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet --version
      - run: dotnet restore Praxis.slnx --locked-mode
      - run: dotnet build Praxis.slnx -c Release --no-restore
      - run: dotnet test Praxis.slnx -c Release --no-build --no-restore
      - run: node --version
      - run: node --check integrations/obsidian/main.js
      - run: node --check integrations/obsidian/archive-session.js
      - run: node --check integrations/obsidian/cli-process.js
      - run: node --test integrations/obsidian/test/archive-session.test.js
      - run: node --check integrations/obsidian/scripts/package.js
      - run: node integrations/obsidian/scripts/package.js artifacts/obsidian/praxis-vault
      - run: node --check artifacts/obsidian/praxis-vault/main.js
      - run: node --test integrations/obsidian/test/packaged-plugin.test.js
      - run: node --check integrations/obsidian/scripts/install-local.js
      - run: node --test integrations/obsidian/test/install-local.test.js
      - run: dotnet publish src/Praxis.Api/Praxis.Api.csproj -c Release --no-build --no-restore -o artifacts/publish
      - run: python3 scripts/release/smoke_api.py
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 scripts/release/smoke_vault_cli.py
        if: matrix.os == 'ubuntu-24.04'
      - run: node --test integrations/obsidian/test/archive-session-cli.test.js
        if: matrix.os == 'ubuntu-24.04'
      - run: node --test integrations/obsidian/test/install-local-cli.test.js
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 scripts/release/dependency_inventory.py --check
        if: matrix.os == 'ubuntu-24.04'
      - run: dotnet format Praxis.slnx --verify-no-changes --no-restore
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 scripts/github/plan.py
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 -m unittest discover -s scripts/github -p test_plan.py -v
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 -m unittest discover -s scripts/research -p 'test_*.py' -v
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 scripts/research/local_catalog_probe.py
        if: matrix.os == 'ubuntu-24.04'
