name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Praxis.slnx
      - name: Export generated package locks
        shell: bash
        run: |
          set -euo pipefail
          for project in src/Praxis.Api src/Praxis.Knowledge tests/Praxis.Api.Tests tests/Praxis.Knowledge.Tests; do
            file="$project/packages.lock.json"
            test -f "$file"
            printf 'PRAXIS_LOCK[%s]=' "$file"
            base64 -w0 "$file"
            printf '\n'
          done
      - run: dotnet build Praxis.slnx -c Release --no-restore
      - run: dotnet test Praxis.slnx -c Release --no-build --no-restore
      - run: dotnet format Praxis.slnx --verify-no-changes --no-restore
      - run: python3 scripts/github/plan.py
      - run: python3 -m unittest discover -s scripts/github -p test_plan.py -v
