name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet --version
      - run: dotnet restore Praxis.slnx --locked-mode
      - run: dotnet build Praxis.slnx -c Release --no-restore
      - run: dotnet test Praxis.slnx -c Release --no-build --no-restore
      - run: node --version
      - run: node --check integrations/obsidian/main.js
      - run: node --check integrations/obsidian/archive-session.js
      - run: node --check integrations/obsidian/cli-process.js
      - run: node --test integrations/obsidian/test/archive-session.test.js
      - run: dotnet publish src/Praxis.Api/Praxis.Api.csproj -c Release --no-build --no-restore -o artifacts/publish
      - run: python3 scripts/release/smoke_api.py
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 scripts/release/smoke_vault_cli.py
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 scripts/release/dependency_inventory.py --check
        if: matrix.os == 'ubuntu-24.04'
      - run: dotnet format Praxis.slnx --verify-no-changes --no-restore
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 scripts/github/plan.py
        if: matrix.os == 'ubuntu-24.04'
      - run: python3 -m unittest discover -s scripts/github -p test_plan.py -v
        if: matrix.os == 'ubuntu-24.04'
