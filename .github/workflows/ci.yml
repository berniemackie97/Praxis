name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Praxis.slnx
      - run: dotnet build Praxis.slnx -c Release --no-restore
      - run: dotnet test Praxis.slnx -c Release --no-build --no-restore
      - run: dotnet format Praxis.slnx --verify-no-changes --no-restore
